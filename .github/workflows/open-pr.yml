name: Open pull request

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "chore/**"
      - "docs/**"
      - "refactor/**"
      - "test/**"
      - "hotfix/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: open-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  open-pull-request:
    name: Open pull request
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Create draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          base_branch="develop"

          case "$HEAD_BRANCH" in
            hotfix/*) base_branch="main" ;;
          esac

          existing_pr="$(
            gh pr list \
              --head "$HEAD_BRANCH" \
              --base "$base_branch" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -n "$existing_pr" ]]; then
            echo "Pull request #$existing_pr already exists."
            exit 0
          fi

          title="$(git log -1 --pretty=%s)"

          gh pr create \
            --base "$base_branch" \
            --head "$HEAD_BRANCH" \
            --draft \
            --title "$title" \
            --body-file .github/pull_request_template.md
