projects:
  - name: mars-rover-api
    environments:
      - name: staging
        services:
          - type: web
            name: web-staging
            runtime: docker
            plan: free
            branch: develop
            autoDeployTrigger: checksPass
            healthCheckPath: /health/
            dockerfilePath: ./Dockerfile
            envVars:
              - key: SECRET_KEY
                generateValue: true
              - key: DEBUG
                value: "False"
              - key: ALLOWED_HOSTS
                sync: false
              - key: CSRF_TRUSTED_ORIGINS
                sync: false
              - key: DATABASE_URL
                sync: false
              - key: CORS_ALLOWED_ORIGINS
                sync: false
              - key: SECURE_SSL_REDIRECT
                value: "False"
              - key: SESSION_COOKIE_SECURE
                value: "True"
              - key: CSRF_COOKIE_SECURE
                value: "True"
              - key: USE_SECURE_PROXY_SSL_HEADER
                value: "True"
              - key: DJANGO_SETTINGS_MODULE
                value: config.settings

      - name: production
        services:
          - type: web
            name: web-production
            runtime: docker
            plan: free
            branch: main
            autoDeployTrigger: checksPass
            healthCheckPath: /health/
            dockerfilePath: ./Dockerfile
            envVars:
              - key: SECRET_KEY
                generateValue: true
              - key: DEBUG
                value: "False"
              - key: ALLOWED_HOSTS
                sync: false
              - key: CSRF_TRUSTED_ORIGINS
                sync: false
              - key: DATABASE_URL
                sync: false
              - key: CORS_ALLOWED_ORIGINS
                sync: false
              - key: SECURE_SSL_REDIRECT
                value: "False"
              - key: SESSION_COOKIE_SECURE
                value: "True"
              - key: CSRF_COOKIE_SECURE
                value: "True"
              - key: USE_SECURE_PROXY_SSL_HEADER
                value: "True"
              - key: DJANGO_SETTINGS_MODULE
                value: config.settings
