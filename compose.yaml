services:
  postgres:
    image: postgres:17
    container_name: mars-rover-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mars_rover
      POSTGRES_USER: mars_rover
      POSTGRES_PASSWORD: mars_rover
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mars_rover -d mars_rover"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: mars-rover-api-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://mars_rover:mars_rover@postgres:5432/mars_rover
      ALLOWED_HOSTS: localhost,127.0.0.1,web
      DEBUG: "False"
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      USE_SECURE_PROXY_SSL_HEADER: "False"
      DJANGO_SETTINGS_MODULE: config.settings
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
