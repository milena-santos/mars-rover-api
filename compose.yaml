services:
  postgres:
    image: postgres:17
    container_name: mars-rover-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mars_rover
      POSTGRES_USER: mars_rover
      POSTGRES_PASSWORD: mars_rover
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mars_rover -d mars_rover"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
